micronaut:
  application:
    name: api
  server:
    cors:
      enabled: true
      configurations:
        web:
          allowed-origins:
          - https://schullersoftwareservices.com
          allowed-methods:
          - GET
          - POST
          - OPTIONS
          allowed-headers:
          - Authorization
          - Content-Type
  security:
    authentication: bearer
    token:
      jwt:
        signatures:
          cache:
            enabled: true
            cache-type: redis
#            dynamodb:
#              table-name: jwks-cache
#              primary-key: PK
#              secondary-key: SK

          jwks:
            google:
              url: https://www.googleapis.com/oauth2/v3/certs
    endpoints:
      logout:
        get-allowed: true
    redirect:
      enabled: false
      unauthorized:
        enabled: false
netty:
  default:
    allocator:
      max-order: 3

redis:
  uri: redis://localhost
