name: Build Test Deploy

permissions:
  id-token: write
  contents: read

on:
  workflow_dispatch:
  push:
    branches:
    - main
jobs:
  api:
    defaults:
      run:
        working-directory: api/api
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: temurin
        cache: maven
    - name: Run tests
      run: ./mvnw test
    - name: Build artifact
      run: ./mvnw package
    - run: mkdir staging && cp target/*.jar staging
    - uses: actions/upload-artifact@v4
      with:
        name: api.jar
        path: ./api/api/staging
        if-no-files-found: error

  infra:
    needs: api
    defaults:
      run:
        working-directory: infra
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT }}:role/github-action-admin-role
        aws-region: eu-west-1
    - uses: actions/download-artifact@v4
      with:
        name: api.jar
        path: ./api/api/target
    - name: Terraform Init
      run: terraform init
    - name: Terraform Plan
      run: terraform plan
    - name: Terraform Apply
      run: terraform apply -auto-approve
  frontend:
    defaults:
      run:
        working-directory: frontend/schuller-software-services
    needs: infra
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: 20.x
    - name: Install dependencies
      run: yarn
    - run: yarn run build
    - run: yarn run test

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT }}:role/github-action-admin-role
        aws-region: eu-west-1
    - name: Deploy to S3
      run: aws s3 sync ./build s3://${{ secrets.AWS_BUCKET }}/

  notify:
    needs: [api, infra, frontend]
    runs-on: ubuntu-latest
    if: always()
    steps:
    - name: Notify Slack
      uses: slackapi/slack-github-action@v2
      with:
        webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
        webhook-type: incoming-webhook
        payload: |
          {
            "text": "${{ (needs.api.result == 'success' && needs.infra.result == 'success' && needs.frontend.result == 'success') && '✅ Deploy succeeded' || '❌ Deploy failed' }} on `${{ github.ref_name }}` by ${{ github.actor }}",
            "attachments": [
              {
                "color": "${{ (needs.api.result == 'success' && needs.infra.result == 'success' && needs.frontend.result == 'success') && 'good' || 'danger' }}",
                "fields": [
                  { "title": "API", "value": "${{ needs.api.result }}", "short": true },
                  { "title": "Infra", "value": "${{ needs.infra.result }}", "short": true },
                  { "title": "Frontend", "value": "${{ needs.frontend.result }}", "short": true },
                  { "title": "Run", "value": "<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View logs>", "short": true }
                ]
              }
            ]
          }
